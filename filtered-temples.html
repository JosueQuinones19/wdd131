<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filtered Temple Album – Josue Quiñones</title>

    <meta name="description" content="A responsive, filterable temple album with dynamically generated temple cards.">

    <footer>
