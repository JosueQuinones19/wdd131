<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Josue Quiñones">
    <meta name="description" content="Submit a product review and rate installation, features, and usefulness.">
    <title>Product Review Form – Josue Quiñones</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Rating -->
            <fieldset>
                <legend>Overall Rating *</legend>

                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">☆</label>

                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">☆☆</label>

                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">☆☆☆</label>

                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">☆☆☆☆</label>

                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">☆☆☆☆☆</label>
            </fieldset>

            <!-- Date -->
            <label for="install">Date of Installation *</label>
            <input type="date" id="install" name="install" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <input type="checkbox" id="feature1" name="features" value="durability">
                <label for="feature1">Durability</label>

                <input type="checkbox" id="feature2" name="features" value="design">
                <label for="feature2">Design</label>

                <input type="checkbox" id="feature3" name="features" value="performance">
                <label for="feature3">Performance</label>

                <input type="checkbox" id="feature4" name="features" value="price">
                <label for="feature4">Price</label>
            </fieldset>

            <!-- Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <!-- Optional Name -->
            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <!-- Submit -->
            <input type="submit" value="Submit Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Josue Quiñones</p>
    </footer>
</body>

</html>
