<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form – Josue Quiñones</title>
    <meta name="description"
        content="Submit a product review including rating, installation date, features, and comments. Dynamic select options and responsive design included.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
                <!-- Options added dynamically from JS -->
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating *</legend>

                <div class="rating">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1">☆</label>

                    <input type="radio" id="rating2" name="rating" value="2">
                    <label for="rating2">☆☆</label>

                    <input type="radio" id="rating3" name="rating" value="3">
                    <label for="rating3">☆☆☆</label>

                    <input type="radio" id="rating4" name="rating" value="4">
                    <label for="rating4">☆☆☆☆</label>

                    <input type="radio" id="rating5" name="rating" value="5">
                    <label for="rating5">☆☆☆☆☆</label>
                </div>
            </fieldset>

            <!-- Installation Date -->
            <label for="install">Date of Installation *</label>
            <input type="date" id="install" name="install" required>

            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <label><input type="checkbox" id="feature1" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" id="feature2" name="features" value="design"> Design</label>
                <label><input type="checkbox" id="feature3" name="features" value="performance"> Performance</label>
                <label><input type="checkbox" id="feature4" name="features" value="price"> Price</label>
            </fieldset>

            <!-- Written Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="4" placeholder="Write your review here..."></textarea>

            <!-- User Name -->
            <label for="username">Your Name</label>
            <input type="text" id="username" name="username" placeholder="Optional">

            <!-- Submit Button -->
            <input type="submit" value="Submit Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Josue Quiñones</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
